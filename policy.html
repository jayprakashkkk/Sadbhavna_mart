<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Privacy Policy — Sadbhavna Mart</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}
body{
  background:linear-gradient(135deg,#000,#0f172a,#111827);
  color:#fff;
  width:100%;
  max-width:100%;
  padding:25px;
  min-height:100vh;
}
.top-bar{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}
.circle-btn{
  width:45px;
  height:45px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  text-decoration:none;
  color:#00ff99;
  font-size:20px;
  border:1px solid rgba(255,255,255,0.15);
  backdrop-filter:blur(6px);
}
h1{
  color:#00ff99;
  margin-bottom:20px;
}
.box{
  width:100%;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  padding:24px;
  border-radius:20px;
  font-size:17px;
  line-height:1.8;
  color:#ddd;
}
</style>
</head>

<body>
<div class="top-bar">
  <a href="profile.html" class="circle-btn" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></a>
</div>
<h1>🔒 Privacy Policy</h1>
<div class="box">
  • Your cart, wishlist, and saved room details stay locally on your device (`localStorage`).
  <br><br>
  • We never sell or share personal information with third parties.
  <br><br>
  • Delivery details you submit are only used to dispatch your order on WhatsApp.
</div>
</body>
</html>
