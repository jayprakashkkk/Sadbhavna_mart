<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="jar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="35%" stop-color="#059669"/>
      <stop offset="70%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="lid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <radialGradient id="sh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="#fff"/>
  <ellipse cx="200" cy="346" rx="115" ry="18" fill="url(#sh)"/>
  <!-- Glass/Green Jar -->
  <rect x="115" y="102" width="170" height="238" rx="28" fill="url(#jar)"/>
  <rect x="130" y="114" width="22" height="210" rx="10" fill="#fff" opacity="0.14"/>
  <!-- Gold Lid -->
  <rect x="128" y="62" width="144" height="44" rx="12" fill="url(#lid)"/>
  <rect x="122" y="96" width="156" height="12" rx="6" fill="#065f46"/>
  <!-- Label -->
  <rect x="125" y="152" width="150" height="132" rx="14" fill="#fef3c7"/>
  <rect x="131" y="158" width="138" height="120" rx="10" fill="#065f46"/>
  <text x="200" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="900" fill="#fde047">BRU</text>
  <text x="200" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff" letter-spacing="2">INSTANT</text>
  <text x="200" y="264" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#a7f3d0">ROASTED COFFEE</text>
  <!-- Coffee Beans -->
  <g transform="translate(275,320) rotate(-20)">
    <ellipse cx="0" cy="0" rx="16" ry="11" fill="#451a03"/>
    <path d="M-12,0 Q0,5 12,0" stroke="#78350f" stroke-width="2" fill="none"/>
  </g>
  <g transform="translate(302,332) rotate(25)">
    <ellipse cx="0" cy="0" rx="14" ry="10" fill="#3b1602"/>
    <path d="M-10,0 Q0,4 10,0" stroke="#78350f" stroke-width="2" fill="none"/>
  </g>
</svg>
