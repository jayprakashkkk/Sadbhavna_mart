<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Profile — Sadbhavna Mart</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
body{
  background:linear-gradient(135deg,#000,#0f172a,#111827);
  color:#fff;
  width:100%;
  max-width:100%;
  min-height:100vh;
  padding:22px;
  padding-bottom:120px;
}
.header{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:24px;
}
.header a{
  color:#00ff99;
  font-size:24px;
  text-decoration:none;
}
.header h1{
  font-size:30px;
  color:#00ff99;
}
.profile-card{
  width:100%;
  max-width:100%;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:26px;
  padding:24px;
  backdrop-filter:blur(10px);
  box-shadow:0 0 30px rgba(0,255,153,0.1);
}
.section-title{
  margin-bottom:16px;
  font-size:22px;
  color:#00ff99;
}
.options-grid{
  display:grid;
  gap:14px;
  grid-template-columns:1fr;
}
@media screen and (min-width:900px){
  .options-grid{
    grid-template-columns:repeat(2,1fr);
  }
}
.option-box{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  padding:18px 20px;
  border-radius:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  transition:0.2s;
  cursor:pointer;
}
.option-box:hover{
  transform:translateY(-2px);
  box-shadow:0 0 18px rgba(0,255,153,0.2);
}
.option-left{
  display:flex;
  align-items:center;
  gap:14px;
  font-size:17px;
}
.option-left i{
  font-size:21px;
  color:#00ff99;
}
.option-right{
  color:#94a3b8;
  font-size:15px;
}
#languageSelect{
  background:#0f172a;
  color:#fff;
  padding:8px 12px;
  border:1px solid rgba(255,255,255,0.15);
  border-radius:10px;
  font-size:14px;
  outline:none;
  cursor:pointer;
}
.store-btn{
  display:block;
  width:100%;
  text-align:center;
  text-decoration:none;
  padding:15px;
  border-radius:16px;
  margin-top:22px;
  background:#00ff99;
  color:#000;
  font-size:17px;
  font-weight:bold;
}
.footer{
  text-align:center;
  margin-top:24px;
  color:#94a3b8;
  font-size:14px;
}
.link{
  text-decoration:none;
  color:#fff;
}
/* MODAL */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  display:none;
  z-index:200;
}
.modal-overlay.active{ display:block; }
.modal-box{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:92%;
  max-width:460px;
  background:#0f172a;
  border:1px solid rgba(0,255,153,0.35);
  border-radius:22px;
  padding:24px;
  display:none;
  z-index:201;
}
.modal-box.active{ display:block; }
.modal-box h2{
  color:#00ff99;
  margin-bottom:14px;
}
.modal-input{
  width:100%;
  padding:12px 14px;
  margin-bottom:12px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.14);
  background:rgba(255,255,255,0.06);
  color:#fff;
  font-size:15px;
  outline:none;
}
.modal-actions{
  display:flex;
  gap:10px;
  margin-top:6px;
}
.btn-save{
  flex:1;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#00ff99;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
.btn-cancel{
  flex:1;
  padding:12px;
  border:none;
  border-radius:12px;
  background:rgba(255,255,255,0.12);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:75px;
  background:rgba(10,15,28,0.94);
  backdrop-filter:blur(12px);
  border-top:1px solid rgba(255,255,255,0.1);
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:99;
}
.bottom-nav a{
  text-decoration:none;
  color:#94a3b8;
}
.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  font-size:12px;
  padding:8px 18px;
  border-radius:16px;
}
.nav-item i{ font-size:20px; }
.nav-item.active{
  color:#00ff99;
  background:rgba(0,255,153,0.08);
}
</style>
</head>

<body>

<div class="header">
  <a href="index.html?nav=1" aria-label="Back to Store"><i class="fa-solid fa-arrow-left"></i></a>
  <h1 id="pageTitle" data-en="Profile" data-hi="प्रोफाइल">Profile</h1>
</div>

<div class="profile-card">
  <h2 class="section-title" id="sectionTitle" data-en="Settings &amp; Quick Access" data-hi="सेटिंग्स और विकल्प">Settings &amp; Quick Access</h2>

  <div class="options-grid">
    <div class="option-box" onclick="openProfileModal()">
      <div class="option-left">
        <i class="fa-solid fa-user"></i>
        <span class="i18n" data-en="Saved Delivery Details" data-hi="डिलीवरी विवरण">Saved Delivery Details</span>
      </div>
      <div class="option-right" id="savedNameBadge">Edit</div>
    </div>

    <a href="wishlist.html" class="link">
      <div class="option-box">
        <div class="option-left">
          <i class="fa-solid fa-heart"></i>
          <span class="i18n" data-en="Wishlist" data-hi="विशलिस्ट">Wishlist</span>
        </div>
        <div class="option-right"><i class="fa-solid fa-angle-right"></i></div>
      </div>
    </a>

    <a href="orders.html" class="link">
      <div class="option-box">
        <div class="option-left">
          <i class="fa-solid fa-box"></i>
          <span class="i18n" data-en="Orders" data-hi="ऑर्डर्स">Orders</span>
        </div>
        <div class="option-right"><i class="fa-solid fa-angle-right"></i></div>
      </div>
    </a>

    <div class="option-box">
      <div class="option-left">
        <i class="fa-solid fa-language"></i>
        <span class="i18n" data-en="Language Settings" data-hi="भाषा सेटिंग्स">Language Settings</span>
      </div>
      <select id="languageSelect">
        <option value="English">English</option>
        <option value="Hindi">Hindi</option>
      </select>
    </div>

    <a href="about.html" class="link">
      <div class="option-box">
        <div class="option-left">
          <i class="fa-solid fa-circle-info"></i>
          <span class="i18n" data-en="About Sadbhavna Mart" data-hi="सद्भावना मार्ट के बारे में">About Sadbhavna Mart</span>
        </div>
        <div class="option-right"><i class="fa-solid fa-angle-right"></i></div>
      </div>
    </a>

    <a href="terms.html" class="link">
      <div class="option-box">
        <div class="option-left">
          <i class="fa-solid fa-file-contract"></i>
          <span class="i18n" data-en="Terms &amp; Conditions" data-hi="नियम और शर्तें">Terms &amp; Conditions</span>
        </div>
        <div class="option-right"><i class="fa-solid fa-angle-right"></i></div>
      </div>
    </a>

    <a href="policy.html" class="link">
      <div class="option-box">
        <div class="option-left">
          <i class="fa-solid fa-shield-halved"></i>
          <span class="i18n" data-en="Privacy Policy" data-hi="प्राइवेसी पॉलिसी">Privacy Policy</span>
        </div>
        <div class="option-right"><i class="fa-solid fa-angle-right"></i></div>
      </div>
    </a>

    <a href="https://wa.me/447781554727?text=Hi%20Sadbhavna%20Mart%20Support!" target="_blank" class="link">
      <div class="option-box">
        <div class="option-left">
          <i class="fa-brands fa-whatsapp"></i>
          <span class="i18n" data-en="WhatsApp Support" data-hi="व्हाट्सएप सहायता">WhatsApp Support</span>
        </div>
        <div class="option-right" style="color:#00ff99;font-weight:bold;">Online</div>
      </div>
    </a>
  </div>

  <a href="index.html?nav=1" class="store-btn" id="storeBtn" data-en="Back to Storefront" data-hi="स्टोर पर वापस जाएं">Back to Storefront</a>
</div>

<div class="footer" id="footerText" data-en="© 2026 Sadbhavna Mart" data-hi="© 2026 सद्भावना मार्ट">© 2026 Sadbhavna Mart</div>

<!-- DELIVERY DETAILS MODAL -->
<div class="modal-overlay" id="profileOverlay" onclick="closeProfileModal()"></div>
<div class="modal-box" id="profileModal">
  <h2>📝 Delivery Details</h2>
  <input type="text" id="profName" class="modal-input" placeholder="Your Name">
  <input type="text" id="profRoom" class="modal-input" placeholder="Room Number (e.g. 204)">
  <input type="text" id="profHostel" class="modal-input" placeholder="Hostel / Block Name">
  <input type="tel" id="profPhone" class="modal-input" placeholder="WhatsApp / Mobile Number">
  <div class="modal-actions">
    <button class="btn-save" onclick="saveProfile()">Save Details</button>
    <button class="btn-cancel" onclick="closeProfileModal()">Cancel</button>
  </div>
</div>

<div class="bottom-nav">
  <a href="index.html?nav=1">
    <div class="nav-item">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </div>
  </a>
  <a href="category.html">
    <div class="nav-item">
      <i class="fa-solid fa-layer-group"></i>
      <span>Category</span>
    </div>
  </a>
  <a href="profile.html">
    <div class="nav-item active">
      <i class="fa-solid fa-user"></i>
      <span>Profile</span>
    </div>
  </a>
</div>

<script>
const languageSelect = document.getElementById("languageSelect");

function applyLanguage(lang) {
  const key = lang === "Hindi" ? "hi" : "en";
  document.getElementById("pageTitle").innerText = document.getElementById("pageTitle").dataset[key];
  document.getElementById("sectionTitle").innerText = document.getElementById("sectionTitle").dataset[key];
  document.getElementById("storeBtn").innerText = document.getElementById("storeBtn").dataset[key];
  document.getElementById("footerText").innerText = document.getElementById("footerText").dataset[key];
  document.querySelectorAll(".i18n").forEach(el => {
    el.innerText = el.dataset[key];
  });
}

languageSelect.addEventListener("change", function () {
  localStorage.setItem("sadbhavna_lang", this.value);
  applyLanguage(this.value);
});

function loadSavedProfile() {
  try {
    const p = JSON.parse(localStorage.getItem("sadbhavna_profile")) || {};
    document.getElementById("profName").value = p.name || "";
    document.getElementById("profRoom").value = p.room || "";
    document.getElementById("profHostel").value = p.hostel || "";
    document.getElementById("profPhone").value = p.phone || "";
    document.getElementById("savedNameBadge").innerText = p.name ? p.name : "Edit";
  } catch (e) {}
}

function openProfileModal() {
  loadSavedProfile();
  document.getElementById("profileOverlay").classList.add("active");
  document.getElementById("profileModal").classList.add("active");
}

function closeProfileModal() {
  document.getElementById("profileOverlay").classList.remove("active");
  document.getElementById("profileModal").classList.remove("active");
}

function saveProfile() {
  const profile = {
    name: document.getElementById("profName").value.trim(),
    room: document.getElementById("profRoom").value.trim(),
    hostel: document.getElementById("profHostel").value.trim(),
    phone: document.getElementById("profPhone").value.trim()
  };
  localStorage.setItem("sadbhavna_profile", JSON.stringify(profile));
  loadSavedProfile();
  closeProfileModal();
}

const savedLang = localStorage.getItem("sadbhavna_lang") || "English";
languageSelect.value = savedLang;
applyLanguage(savedLang);
loadSavedProfile();
</script>

</body>
</html>
