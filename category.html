<!-- category.html -->

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Category</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(
135deg,
#000,
#0f172a,
#111827
);
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow:hidden;
}

/* CARD */

.coming-box{
width:100%;
max-width:500px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,0.1);
border-radius:30px;
padding:45px 30px;
text-align:center;
box-shadow:0 0 30px rgba(0,255,153,0.15);
animation:fadeUp 0.7s ease;
}

.coming-box i{
font-size:70px;
color:#00ff99;
margin-bottom:25px;
}

.coming-box h1{
font-size:38px;
color:#00ff99;
margin-bottom:18px;
}

.coming-box p{
font-size:20px;
color:#ccc;
line-height:1.8;
}

/* BUTTON */

.back-btn{
display:inline-block;
margin-top:35px;
padding:14px 30px;
border-radius:16px;
background:#00ff99;
color:black;
font-size:18px;
font-weight:bold;
text-decoration:none;
transition:0.3s;
}

.back-btn:hover{
transform:scale(1.05);
}

/* ANIMATION */

@keyframes fadeUp{

from{
opacity:0;
transform:translateY(25px);
}

to{
opacity:1;
transform:translateY(0);
}

}

</style>

</head>

<body>

<div class="coming-box">

<i class="fa-solid fa-layer-group"></i>

<h1>Coming Soon...</h1>

<p>

Categories feature is under development 🚀

<br><br>

New snack categories will be available very soon 😎

</p>

<a href="index.html"
class="back-btn">

⬅ Back To Home

</a>

</div>

</body>

</html>
