<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Categories — Sadbhavna Mart</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ff99">
<link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
<link rel="apple-touch-icon" href="images/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="i18n.js" defer></script>
<script src="pwa.js" defer></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
body{
  background:linear-gradient(135deg,#000,#0f172a,#111827);
  color:#fff;
  min-height:100vh;
  width:100%;
  padding-bottom:110px;
  overflow-x:hidden;
}
.top-header{
  width:100%;
  padding:16px;
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(0,0,0,0.78);
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}
.top-left{
  display:flex;
  align-items:center;
  gap:12px;
}
.top-left a{
  color:#00ff99;
  font-size:22px;
  text-decoration:none;
}
.top-bar h1{
  color:#00ff99;
  font-size:22px;
}
.cart-pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:#00ff99;
  color:#000;
  font-weight:bold;
  padding:8px 14px;
  border-radius:999px;
  text-decoration:none;
  font-size:13.5px;
}
.search-box input{
  width:100%;
  padding:12px 14px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.1);
  outline:none;
  background:rgba(255,255,255,0.06);
  color:#fff;
  font-size:15px;
}
.tabs{
  width:100%;
  display:flex;
  gap:8px;
  padding:12px 14px 4px;
  overflow-x:auto;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{ display:none; }
.tab-btn{
  flex:0 0 auto;
  padding:8px 14px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,0.14);
  background:rgba(255,255,255,0.05);
  color:#cbd5e1;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}
.tab-btn.active{
  background:#00ff99;
  color:#000;
  border-color:#00ff99;
}
.grid{
  width:100%;
  max-width:100%;
  padding:12px;
  display:grid;
  gap:12px;
  grid-template-columns:repeat(2,1fr);
}
.card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.09);
  border-radius:16px;
  padding:10px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  position:relative;
  transition:0.2s;
}
.card:hover{
  transform:translateY(-3px);
  border-color:rgba(0,255,153,0.4);
}
.card img{
  width:100%;
  height:138px;
  object-fit:contain;
  background:#fff;
  padding:6px;
  border-radius:12px;
  margin-bottom:8px;
}
.card.out-of-stock img{
  filter:grayscale(100%) opacity(0.45);
}
.out-badge{
  position:absolute;
  top:36px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(220,38,38,0.94);
  color:#fff;
  font-size:10px;
  font-weight:800;
  padding:4px 9px;
  border-radius:999px;
  white-space:nowrap;
}
.cat-tag{
  display:inline-block;
  font-size:10.5px;
  color:#00ff99;
  background:rgba(0,255,153,0.1);
  padding:2px 8px;
  border-radius:999px;
  margin-bottom:5px;
  width:fit-content;
}
.card h2{
  font-size:14.5px;
  margin-bottom:4px;
  color:#fff;
}
.card-top-actions{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:5;
}
.fav-icon{
  width:28px;
  height:28px;
  border-radius:50%;
  background:rgba(15,23,42,0.78);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13.5px;
  cursor:pointer;
  color:#fff;
}
.fav-icon.liked{
  color:#ff2e63;
}
.qty-wrap{
  display:flex;
  align-items:center;
}
.top-add-btn{
  width:30px;
  height:30px;
  border:none;
  border-radius:50%;
  background:#00ff99;
  color:#000;
  font-weight:800;
  font-size:20px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}
.top-add-btn:disabled{
  background:#475569;
  color:#cbd5e1;
  cursor:not-allowed;
}
.top-stepper{
  height:28px;
  display:flex;
  align-items:center;
  background:#0f172a;
  border:1.5px solid #00ff99;
  border-radius:999px;
  overflow:hidden;
}
.top-stepper button{
  width:24px;
  height:100%;
  border:none;
  background:#00ff99;
  color:#000;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
}
.top-stepper span{
  min-width:20px;
  text-align:center;
  font-weight:800;
  font-size:12px;
  color:#fff;
  padding:0 3px;
}
.title-price-row{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:6px;
}
.price-tag{
  font-size:13px;
  font-weight:800;
  color:#00ff99;
  white-space:nowrap;
}
.stock-msg{
  font-size:11.5px;
  font-weight:800;
  margin-top:6px;
  text-align:center;
  padding:4px 7px;
  border-radius:8px;
}
.stock-msg.low{
  color:#ff4d4d;
  background:rgba(239,68,68,0.16);
  border:1px solid rgba(239,68,68,0.48);
  animation:lowPulse 1.3s ease-in-out infinite;
}
.stock-msg.out{
  color:#fca5a5;
  background:rgba(220,38,38,0.22);
  border:1px solid rgba(220,38,38,0.55);
}
@keyframes lowPulse{
  0%,100%{opacity:1;}
  50%{opacity:0.55;}
}
@media screen and (min-width:768px){
  .grid{ padding:18px; gap:16px; grid-template-columns:repeat(3,1fr); }
  .card{ padding:12px; border-radius:16px; }
  .card img{ height:155px; padding:8px; }
  .card h2{ font-size:15.5px; }
}
@media screen and (min-width:1100px){
  .grid{ padding:20px; gap:18px; grid-template-columns:repeat(5,1fr); }
  .card img{ height:170px; }
}
.empty-msg{
  grid-column:1 / -1;
  text-align:center;
  padding:50px 20px;
  color:#94a3b8;
  font-size:18px;
}
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:75px;
  background:rgba(10,15,28,0.94);
  backdrop-filter:blur(12px);
  border-top:1px solid rgba(255,255,255,0.1);
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:99;
}
.bottom-nav a{
  text-decoration:none;
  color:#94a3b8;
}
.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  font-size:12px;
  padding:8px 18px;
  border-radius:16px;
}
.nav-item i{ font-size:20px; }
.nav-item.active{
  color:#00ff99;
  background:rgba(0,255,153,0.08);
}
</style>
<link rel="stylesheet" href="nav-bar.css">
<style>
.lang-toggle-btn{
  padding:5px 10px;border-radius:999px;border:1px solid rgba(0,255,153,0.4);
  background:rgba(0,255,153,0.1);color:#00ff99;font-size:11.5px;font-weight:800;cursor:pointer;
}
</style>
</head>

<body>

<header class="top-header">
  <div class="top-bar">
    <div class="top-left">
      <a href="index.html?nav=1" aria-label="Back to Home"><i class="fa-solid fa-arrow-left"></i></a>
      <h1 data-i18n="catHeading">🗂️ Categories</h1>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="lang-toggle-btn" data-lang-toggle onclick="toggleCatLang()">EN | हिं</button>
      <a href="index.html?nav=1" class="cart-pill" id="cart-pill">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-count">0</span> • ₹<span id="cart-total">0</span>
      </a>
    </div>
  </div>
  <div class="search-box">
    <input type="text" id="catSearch" data-i18n-placeholder="catSearchPlaceholder" placeholder="Search in categories..." oninput="renderItems()">
  </div>
</header>

<div class="tabs" id="categoryTabs">
  <button class="tab-btn active" data-i18n="catTabAll" onclick="selectCategory('All', this)">All</button>
  <button class="tab-btn" data-i18n="catTabSnacks" onclick="selectCategory('Biscuits & Snacks', this)">🍪 Biscuits &amp; Snacks</button>
  <button class="tab-btn" data-i18n="catTabMeals" onclick="selectCategory('Instant Meals', this)">🍜 Instant Meals</button>
  <button class="tab-btn" data-i18n="catTabDrinks" onclick="selectCategory('Beverages & Dairy', this)">☕ Beverages &amp; Dairy</button>
  <button class="tab-btn" data-i18n="catTabPantry" onclick="selectCategory('Daily Pantry', this)">🧂 Daily Pantry</button>
  <button class="tab-btn" data-i18n="catTabStationery" onclick="selectCategory('Stationery', this)">📚 Stationery</button>
</div>

<div class="grid" id="productGrid"></div>

<div class="bottom-nav">
  <a href="index.html?nav=1">
    <div class="nav-item">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </div>
  </a>
  <a href="category.html">
    <div class="nav-item active">
      <i class="fa-solid fa-layer-group"></i>
      <span>Category</span>
    </div>
  </a>
  <a href="profile.html">
    <div class="nav-item">
      <i class="fa-solid fa-user"></i>
      <span>Profile</span>
    </div>
  </a>
</div>

<script>
const PRODUCTS = [
  { name: "Parle G", img: "ParleG.jpg", category: "Biscuits & Snacks", price: 10 },
  { name: "Bourbon", img: "Bourbon.jpg", category: "Biscuits & Snacks", price: 30 },
  { name: "Tedhe Medhe", img: "Tedhe Medhe.webp", category: "Biscuits & Snacks", price: 20 },
  { name: "Kurkure", img: "Kurkure.jpg", category: "Biscuits & Snacks", price: 20 },
  { name: "Lays Classic", img: "images/lays-classic.jpg", category: "Biscuits & Snacks", price: 20 },
  { name: "Oreo", img: "images/oreo.jpg", category: "Biscuits & Snacks", price: 30 },
  { name: "Good Day", img: "images/good-day.jpg", category: "Biscuits & Snacks", price: 25 },
  { name: "Dairy Milk", img: "images/dairy-milk.jpg", category: "Biscuits & Snacks", price: 40 },
  { name: "Cup Maggi", img: "Cup Maggie.jpg", category: "Instant Meals", price: 50 },
  { name: "Maggi Double Masala", img: "maggie.jpeg", category: "Instant Meals", price: 28 },
  { name: "Yippee Noodles", img: "images/yippee-noodles.jpg", category: "Instant Meals", price: 25 },
  { name: "Milk", img: "Milk.png", category: "Beverages & Dairy", price: 30 },
  { name: "Nescafe Coffee", img: "Coffie.webp", category: "Beverages & Dairy", price: 20 },
  { name: "BRU Coffee", img: "Coffie2.jpg", category: "Beverages & Dairy", price: 20 },
  { name: "Tata Tea", img: "Chaipatti1.jpg", category: "Beverages & Dairy", price: 60 },
  { name: "Red Label", img: "Chaipatti2.jpg", category: "Beverages & Dairy", price: 65 },
  { name: "Frooti", img: "images/frooti.jpg", category: "Beverages & Dairy", price: 20 },
  { name: "Coca-Cola", img: "images/coca-cola.jpg", category: "Beverages & Dairy", price: 40 },
  { name: "Chini", img: "Chini.jpeg", category: "Daily Pantry", price: 45 },
  { name: "Bread", img: "images/bread.jpg", category: "Daily Pantry", price: 40 },
  { name: "Linc Glycer Blue", img: "images/linc-glycer-blue.jpg", category: "Stationery", price: 10 },
  { name: "Linc Glycer Black", img: "images/linc-glycer-black.jpg", category: "Stationery", price: 10 },
  { name: "Pentonic Blue", img: "images/pentonic-blue.jpg", category: "Stationery", price: 10 },
  { name: "Pentonic Black", img: "images/pentonic-black.jpg", category: "Stationery", price: 10 },
  { name: "Pentonic B-RT", img: "images/pentonic-vrt.jpg", category: "Stationery", price: 20 },
  { name: "Practical File (100p)", img: "images/practical-file-40.jpg", category: "Stationery", price: 40 },
  { name: "Practical File (140p)", img: "images/practical-file-50.jpg", category: "Stationery", price: 50 },
  { name: "Practical File (Hardcover)", img: "images/practical-file-60.jpg", category: "Stationery", price: 60 }
];

let hiddenItems = [];
try {
  const customList = JSON.parse(localStorage.getItem("sadbhavna_custom_products") || "[]") || [];
  const priceOverrides = JSON.parse(localStorage.getItem("sadbhavna_price_overrides") || "{}") || {};
  hiddenItems = JSON.parse(localStorage.getItem("sadbhavna_hidden_items") || "[]") || [];

  customList.forEach(p => {
    if (p && p.name && !PRODUCTS.some(x => x.name === p.name)) {
      PRODUCTS.push({
        name: p.name,
        img: p.img || "ParleG.jpg",
        category: p.category || "Biscuits & Snacks",
        price: Number(p.price) || 10,
        defaultStock: typeof p.stock === "number" ? p.stock : 15
      });
    }
  });

  PRODUCTS.forEach(p => {
    if (Number(priceOverrides[p.name]) > 0) {
      p.price = Number(priceOverrides[p.name]);
    }
  });
} catch (e) {}

let activeCategory = "All";
let cart = {};
let favs = [];
let stockMap = {};
PRODUCTS.forEach(p => { stockMap[p.name] = typeof p.defaultStock === "number" ? p.defaultStock : 50; });

try { cart = JSON.parse(localStorage.getItem("sadbhavna_cart")) || {}; } catch(e) { cart = {}; }
try { favs = JSON.parse(localStorage.getItem("sadbhavna_favs")) || []; } catch(e) { favs = []; }

function saveState() {
  localStorage.setItem("sadbhavna_cart", JSON.stringify(cart));
  localStorage.setItem("sadbhavna_favs", JSON.stringify(favs));
  updateBadge();
}

function updateBadge() {
  let total = 0;
  let subtotal = 0;
  PRODUCTS.forEach(p => {
    const q = Number(cart[p.name]) || 0;
    total += q;
    subtotal += q * p.price;
  });
  document.getElementById("cart-count").innerText = total;
  const totalEl = document.getElementById("cart-total");
  if (totalEl) totalEl.innerText = subtotal;
}

function getStock(name) {
  return typeof stockMap[name] === "number" ? stockMap[name] : 0;
}

async function loadStock() {
  try {
    if (!localStorage.getItem("sadbhavna_stock_schema_v2")) {
      localStorage.removeItem("sadbhavna_local_stock");
      localStorage.removeItem("sadbhavna_stock_snapshot");
      localStorage.removeItem("sadbhavna_stock_updated_at");
      localStorage.setItem("sadbhavna_stock_schema_v2", "1");
    }
  } catch (e) {}
  try {
    const res = await fetch("/api/stock", { cache: "no-store" });
    if (res.ok) {
      const data = await res.json();
      if (data && data.stock) {
        stockMap = Object.assign({}, stockMap, data.stock);
        renderItems();
        return;
      }
    }
  } catch (e) {}

  try {
    const res = await fetch("stock.json?t=" + Date.now(), { cache: "no-store" });
    if (res.ok) {
      const baseStock = await res.json();
      const rawSnapshot = JSON.stringify(baseStock);
      const prevSnapshot = localStorage.getItem("sadbhavna_stock_snapshot");
      const remoteCfgTs = Number(localStorage.getItem("sadbhavna_remote_updated_at") || 0);
      const localStockTs = Number(localStorage.getItem("sadbhavna_stock_updated_at") || 0);
      if (prevSnapshot !== rawSnapshot) {
        localStorage.setItem("sadbhavna_stock_snapshot", rawSnapshot);
        if (remoteCfgTs >= localStockTs || !localStockTs) {
          localStorage.setItem("sadbhavna_local_stock", rawSnapshot);
        }
      }
      const localOverrides = JSON.parse(localStorage.getItem("sadbhavna_local_stock") || rawSnapshot);
      stockMap = Object.assign({}, baseStock, localOverrides);
    }
  } catch (e) {}
  PRODUCTS.forEach(p => {
    if (stockMap[p.name] === undefined) {
      stockMap[p.name] = typeof p.defaultStock === "number" ? p.defaultStock : 15;
    }
  });
  renderItems();
}

function selectCategory(cat, btn) {
  activeCategory = cat;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderItems();
}

function changeItemQty(name, delta) {
  const available = getStock(name);
  const next = Math.max(0, (Number(cart[name]) || 0) + delta);
  if (next > available) {
    alert("Only " + available + " left in stock for " + name + "!");
    return;
  }
  cart[name] = next;
  saveState();
  renderItems();
}

function toggleFavItem(name) {
  if (favs.includes(name)) {
    favs = favs.filter(x => x !== name);
  } else {
    favs.push(name);
  }
  saveState();
  renderItems();
}

function renderItems() {
  const query = document.getElementById("catSearch").value.trim().toLowerCase();
  const filtered = PRODUCTS.filter(p => {
    if (hiddenItems.includes(p.name)) return false;
    const matchCat = activeCategory === "All" || p.category === activeCategory;
    const matchSearch = !query || p.name.toLowerCase().includes(query) || p.category.toLowerCase().includes(query);
    return matchCat && matchSearch;
  });

  const grid = document.getElementById("productGrid");
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-msg">No items found matching "${query}"</div>`;
    return;
  }

  grid.innerHTML = filtered.map(p => {
    const qty = Number(cart[p.name]) || 0;
    const available = getStock(p.name);
    const isLiked = favs.includes(p.name);
    const safeName = p.name.replace(/'/g, "\\'");

    let stockHtml = "";
    if (available <= 0) {
      const outTxt = window.SadbhavnaI18n ? window.SadbhavnaI18n.t("outOfStockText") : "Out of Stock";
      stockHtml = `<div class="stock-msg out">${outTxt}</div>`;
    } else if (available <= 5) {
      const leftTxt = window.SadbhavnaI18n
        ? ("⚠️ " + window.SadbhavnaI18n.t("onlyLeftPrefix") + available + window.SadbhavnaI18n.t("onlyLeftSuffix"))
        : `⚠️ Only ${available} left`;
      stockHtml = `<div class="stock-msg low">${leftTxt}</div>`;
    }

    const outBadgeTxt = window.SadbhavnaI18n ? window.SadbhavnaI18n.t("outOfStockBadge") : "OUT OF STOCK";
    const ctrlHtml = qty > 0
      ? `<div class="top-stepper"><button onclick="changeItemQty('${safeName}', -1)">-</button><span>${qty}</span><button onclick="changeItemQty('${safeName}', 1)">+</button></div>`
      : `<button class="top-add-btn" ${available <= 0 ? 'disabled' : ''} onclick="changeItemQty('${safeName}', 1)">+</button>`;

    return `
      <div class="card ${available <= 0 ? 'out-of-stock' : ''}">
        <div class="card-top-actions">
          <i class="${isLiked ? 'fa-solid' : 'fa-regular'} fa-heart fav-icon ${isLiked ? 'liked' : ''}" onclick="toggleFavItem('${safeName}')"></i>
          <div class="qty-wrap">${ctrlHtml}</div>
        </div>
        ${available <= 0 ? `<div class="out-badge">${outBadgeTxt}</div>` : ''}
        <div>
          <img src="${p.img}" alt="${p.name}">
          <span class="cat-tag">${p.category}</span>
          <div class="title-price-row">
            <h2>${p.name}</h2>
            <span class="price-tag">₹${p.price}</span>
          </div>
          ${stockHtml}
        </div>
      </div>
    `;
  }).join("");
}

function toggleCatLang() {
  if (window.SadbhavnaI18n) window.SadbhavnaI18n.toggleLang();
}
window.onSadbhavnaLangChange = function () {
  renderItems();
};

async function loadRemoteStoreConfigCat() {
  try {
    const res = await fetch("store-config.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return;
    const remote = await res.json();
    if (!remote || typeof remote !== "object") return;
    const remoteTs = Number(remote.updatedAt) || 0;
    const localTs = Number(localStorage.getItem("sadbhavna_local_updated_at") || 0);
    if (remoteTs > 0 && remoteTs >= localTs) {
      if (Array.isArray(remote.customProducts)) {
        localStorage.setItem("sadbhavna_custom_products", JSON.stringify(remote.customProducts));
        remote.customProducts.forEach(p => {
          if (p && p.name && !PRODUCTS.some(x => x.name === p.name)) {
            PRODUCTS.push({
              name: p.name,
              img: p.img || "ParleG.jpg",
              category: p.category || "Biscuits & Snacks",
              price: Number(p.price) || 10,
              defaultStock: typeof p.stock === "number" ? p.stock : 15
            });
          }
        });
      }
      if (remote.priceOverrides) {
        localStorage.setItem("sadbhavna_price_overrides", JSON.stringify(remote.priceOverrides));
        PRODUCTS.forEach(p => {
          if (Number(remote.priceOverrides[p.name]) > 0) p.price = Number(remote.priceOverrides[p.name]);
        });
      }
      if (Array.isArray(remote.hiddenItems)) {
        hiddenItems = remote.hiddenItems;
        localStorage.setItem("sadbhavna_hidden_items", JSON.stringify(hiddenItems));
      }
      localStorage.setItem("sadbhavna_remote_updated_at", String(remoteTs));
      localStorage.setItem("sadbhavna_local_updated_at", String(remoteTs));
      renderItems();
      updateBadge();
    }
  } catch (e) {}
}

updateBadge();
loadRemoteStoreConfigCat();
loadStock();

window.addEventListener("storage", function (ev) {
  if (!ev.key || ev.key.startsWith("sadbhavna_")) {
    try {
      const localOverrides = JSON.parse(localStorage.getItem("sadbhavna_local_stock") || "{}");
      stockMap = Object.assign({}, stockMap, localOverrides);
    } catch (e) {}
    renderItems();
    updateBadge();
  }
});
</script>
